services:
  back:
    build: ./veille-back
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DB_PATH: /data/kanban.sqlite
      DB_SYNCHRONIZE: "true"
    volumes:
      # Même fichier que en local : inscriptions et cartes créées dans l'app s'écrivent ici
      - ./veille-back/kanban.sqlite:/data/kanban.sqlite
    ports:
      - "3000:3000"
    restart: unless-stopped

  front:
    build:
      context: ./veille-front
      args:
        VITE_PRIMEVUE_LICENSE: ${VITE_PRIMEVUE_LICENSE:-}
    depends_on:
      - back
    ports:
      - "8080:80"
    restart: unless-stopped
