server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Fichiers générés par Vite : leur nom contient un hash, on peut les cacher longtemps
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Même origine que le front : pas de CORS, le navigateur parle uniquement à nginx
  location /api/ {
    proxy_pass http://back:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Application monopage : toute URL inconnue renvoie index.html, Vue Router prend le relais
  location / {
    try_files $uri $uri/ /index.html;
  }
}
